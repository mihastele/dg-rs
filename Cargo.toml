[package]
name = "datagrip-rs"
version = "0.1.0"
edition = "2021"
description = "Open-source database workbench in Rust - a DataGrip alternative"
license = "MIT"
repository = "https://github.com/il-chonko/datagrip-rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.92"
mysql_async = "0.37.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
